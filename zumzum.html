const ldI=src=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src});
const cvs=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const cover=(x,i,X,Y,W,Hh)=>{const r=Math.max(W/i.width,Hh/i.height);x.save();x.beginPath();x.roundRect(X,Y,W,Hh,20);x.clip();x.drawImage(i,X+(W-i.width*r)/2,Y+(Hh-i.height*r)/2,i.width*r,i.height*r);x.restore()};
const AP=[['bg','✂ Удалить фон (однотонный)','Допуск <input id="a1" type="range" min="5" max="120" value="45">',async(i)=>{const c=cvs(i.width,i.height),x=c.getContext('2d');x.drawImage(i,0,0);const d=x.getImageData(0,0,c.width,c.height),a=d.data,W=c.width,pt=[[0,0],[W-1,0],[0,c.height-1],[W-1,c.height-1]].map(([u,v])=>{const k=(v*W+u)*4;return[a[k],a[k+1],a[k+2]]}),bg=[0,1,2].map(j=>pt.reduce((s,q)=>s+q[j],0)/4),t=+$('#a1').value;for(let k=0;k<a.length;k+=4){const df=Math.hypot(a[k]-bg[0],a[k+1]-bg[1],a[k+2]-bg[2]);if(df<t)a[k+3]=0;else if(df<t*1.4)a[k+3]=Math.round(255*(df-t)/(t*.4))}x.putImageData(d,0,0);return c}],
['up','🔍 Улучшить качество','Увеличение <select id="a1"><option>2</option><option>3</option></select> Резкость <input id="a2" type="range" min="0" max="100" value="50">',async(i)=>{const k=+$('#a1').value,w=Math.min(i.width*k,4500),c=cvs(w,Math.round(i.height*w/i.width)),x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(i,0,0,c.width,c.height);const A=+$('#a2').value/100,d=x.getImageData(0,0,c.width,c.height),s=new Uint8ClampedArray(d.data),W=c.width;for(let y=1;y<c.height-1;y++)for(let u=1;u<W-1;u++)for(let j=0;j<3;j++){const q=(y*W+u)*4+j;d.data[q]=s[q]+A*(4*s[q]-s[q-4]-s[q+4]-s[q-W*4]-s[q+W*4])}x.putImageData(d,0,0);return c}],
['ph','📱 Мокап телефона','Фон <input id="a1" type="color" value="#dff0ff">',async(i)=>{const c=cvs(900,1700),x=c.getContext('2d');x.fillStyle=$('#a1').value;x.fillRect(0,0,900,1700);x.fillStyle='#111';x.beginPath();x.roundRect(150,100,600,1500,110);x.fill();cover(x,i,180,130,540,1440);x.fillStyle='#111';x.beginPath();x.roundRect(380,150,140,36,18);x.fill();return c}],
['lp','💻 Мокап ноутбука','Фон <input id="a1" type="color" value="#dff0ff">',async(i)=>{const c=cvs(1600,1100),x=c.getContext('2d');x.fillStyle=$('#a1').value;x.fillRect(0,0,1600,1100);x.fillStyle='#222';x.beginPath();x.roundRect(250,130,1100,720,30);x.fill();cover(x,i,280,160,1040,660);x.fillStyle='#bbb';x.beginPath();x.roundRect(120,850,1360,50,25);x.fill();return c}],
['cr','⛶ Обрезка и поворот','Слева % <input id="a1" type="number" value="0" style="width:60px"> Сверху % <input id="a2" type="number" value="0" style="width:60px"> Справа % <input id="a3" type="number" value="0" style="width:60px"> Снизу % <input id="a4" type="number" value="0" style="width:60px"> Поворот <select id="a5"><option>0</option><option>90</option><option>180</option><option>270</option></select>',async(i)=>{const[l,t,r,b]=[1,2,3,4].map(n=>+$('#a'+n).value/100),sx=i.width*l,sy=i.height*t,w=i.width*(1-l-r),h=i.height*(1-t-b),a=+$('#a5').value,c=cvs(a%180?h:w,a%180?w:h),x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(a*Math.PI/180);x.drawImage(i,sx,sy,w,h,-w/2,-h/2,w,h);return c}],
['cv','⇄ Конвертер и сжатие','Формат <select id="a1"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select> Качество <input id="a2" type="range" min="30" max="100" value="85"> Размер % <input id="a3" type="number" value="100" style="width:60px">',async(i)=>{ao={type:$('#a1').value,q:+$('#a2').value/100};const k=+$('#a3').value/100,c=cvs(Math.round(i.width*k),Math.round(i.height*k)),x=c.getContext('2d');if(ao.type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(i,0,0,c.width,c.height);return c}],
['pl','🎨 Палитра из фото','',async(i)=>{const c=cvs(64,64),x=c.getContext('2d');x.drawImage(i,0,0,64,64);const d=x.getImageData(0,0,64,64).data,m={};for(let k=0;k<d.length;k+=4){const q=[d[k]>>5,d[k+1]>>5,d[k+2]>>5].join();m[q]=(m[q]||0)+1}const top=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([q])=>'#'+q.split(',').map(v=>(+v*32+16).toString(16).padStart(2,'0')).join(''));$('#apo').innerHTML=top.map(h=>`<span class="chip"><span style="width:22px;height:22px;border-radius:6px;background:${h}"></span>${h}</span>`).join('');return i}],
['wm','© Водяной знак','Текст <input id="a1" value="@brand"> Прозрачность <input id="a2" type="range" min="10" max="90" value="40">',async(i)=>{const c=cvs(i.width,i.height),x=c.getContext('2d');x.drawImage(i,0,0);x.globalAlpha=+$('#a2').value/100;x.fillStyle='#fff';x.font=`700 ${Math.round(i.width/14)}px Montserrat,sans-serif`;x.textAlign='center';x.translate(c.width/2,c.height/2);x.rotate(-.35);for(let y=-c.height;y<c.height;y+=c.width/5)for(let u=-c.width;u<c.width;u+=c.width/2.2)x.fillText($('#a1').value,u,y);return c}],
['ad','☀ Яркость и фильтры','Яркость <input id="a1" type="range" min="40" max="160" value="100"> Контраст <input id="a2" type="range" min="40" max="160" value="100"> Насыщ. <input id="a3" type="range" min="0" max="200" value="100"> Ч/Б <input id="a4" type="range" min="0" max="100" value="0"> Размытие <input id="a5" type="range" min="0" max="10" value="0">',async(i)=>{const c=cvs(i.width,i.height),x=c.getContext('2d');x.filter=`brightness(${$('#a1').value}%) contrast(${$('#a2').value}%) saturate(${$('#a3').value}%) grayscale(${$('#a4').value}%) blur(${$('#a5').value}px)`;x.drawImage(i,0,0);return c}]];
let aimg=null;
function apps(){const A=AP.find(a=>a[0]===apk),ph=pm().filter(m=>m.kind==='photo'||m.kind==='logo');
 $('#v').innerHTML=`<div class="ap"><div class="card col">${AP.map(a=>`<button data-ak="${a[0]}" class="${apk===a[0]?'p':''}" style="text-align:left">${a[1]}</button>`).join('')}<p class="mu">Улучшение видео, 3D-редактор и ИИ-удаление сложного фона требуют серверных моделей — в браузере недоступны.</p></div><div class="card"><h3>${A[1]}</h3><div class="row"><input id="af" type="file" accept="image/*"><select id="am"><option value="">или фото из материалов</option>${ph.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div><div class="row" id="actl">${A[2]}</div><div class="row"><button class="p" id="arun">Применить</button><button id="adl">⬇ Скачать</button><button id="asv">В материалы</button></div><div id="apo" class="row"></div><canvas id="aout"></canvas></div></div>`;
 document.querySelectorAll('[data-ak]').forEach(b=>b.onclick=()=>{apk=b.dataset.ak;apps()});
 const get=async()=>{const f=$('#af').files[0],m=S.mats.find(x=>x.id===$('#am').value);if(f)return ldI(URL.createObjectURL(f));if(m&&m.src)return ldI(m.src);throw new Error('Выберите фото')};
 const run=()=>busy($('#arun'),async()=>{const i=await get(),c=await A[3](i),o=$('#aout');o.width=c.width;o.height=c.height;o.getContext('2d').drawImage(c,0,0);aimg=o});
 $('#arun').onclick=run;$('#actl').oninput=()=>{if(aimg&&$('#af').files[0]||$('#am').value)run()};
 $('#adl').onclick=()=>{const o=$('#aout');if(!o.width)return toast('Сначала примените');o.toBlob(b=>dlFile('zumzum-'+apk+'.'+(apk==='cv'?ao.type.split('/')[1].replace('jpeg','jpg'):'png'),b),apk==='cv'?ao.type:'image/png',ao.q)};
 $('#asv').onclick=()=>{const o=$('#aout');if(!o.width)return toast('Сначала примените');const k=Math.min(1,1600/Math.max(o.width,o.height)),c=cvs(o.width*k,o.height*k);c.getContext('2d').drawImage(o,0,0,c.width,c.height);S.mats.push({id:uid(),pid:S.cp,kind:'photo',name:'app-'+apk+'.png',note:'',src:c.toDataURL('image/png')});save();toast('Добавлено в материалы')}}
